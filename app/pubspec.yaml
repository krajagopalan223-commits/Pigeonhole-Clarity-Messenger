name: clarity_messenger
description: Clarity Messenger — cross-platform end-to-end encrypted messaging.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  # Secret-at-rest storage backed by Keychain / Keystore / libsecret.
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
